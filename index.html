<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixel Notes · 像素笔记</title>
  <meta name="description" content="离线优先的像素风备忘录：记事 · 待办 · 日历，资料只存在本机。">
  <meta name="theme-color" content="#f2eee2">
  <meta name="color-scheme" content="light dark">

  <script>
    (function () {
      try {
        var mode = localStorage.getItem('pixel-notes-theme') || 'auto';
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = mode === 'dark' ? 'dark' : mode === 'light' ? 'light' : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
      } catch (err) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23f2eee2'/%3E%3Crect x='2' y='1' width='12' height='14' fill='%23191820'/%3E%3Crect x='3' y='2' width='10' height='12' fill='%23fffdf6'/%3E%3Crect x='6' y='4' width='6' height='1' fill='%23191820'/%3E%3Crect x='6' y='6' width='6' height='1' fill='%23191820'/%3E%3Crect x='7' y='11' width='1' height='1' fill='%233ddc97'/%3E%3Crect x='8' y='12' width='1' height='1' fill='%233ddc97'/%3E%3Crect x='9' y='11' width='1' height='1' fill='%233ddc97'/%3E%3Crect x='10' y='10' width='1' height='1' fill='%233ddc97'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pixel Notes">

  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#/tasks" aria-label="Pixel Notes 首页" data-i18n-aria="Pixel Notes 首页">
        <svg class="brand-mark" viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
          <rect width="16" height="16" fill="#f2eee2"/>
          <rect x="2" y="1" width="12" height="14" fill="#191820"/>
          <rect x="3" y="2" width="10" height="12" fill="#fffdf6"/>
          <rect x="6" y="4" width="6" height="1" fill="#191820"/>
          <rect x="6" y="6" width="6" height="1" fill="#191820"/>
          <rect x="7" y="11" width="1" height="1" fill="#3ddc97"/>
          <rect x="8" y="12" width="1" height="1" fill="#3ddc97"/>
          <rect x="9" y="11" width="1" height="1" fill="#3ddc97"/>
          <rect x="10" y="10" width="1" height="1" fill="#3ddc97"/>
        </svg>
        <span class="brand-text">PIXEL<em>NOTES</em></span>
      </a>

      <nav class="tabs" id="tabs" aria-label="主选单" data-i18n-aria="主选单">
        <a href="#/tasks" data-tab="tasks" data-i18n="待办">待办</a>
        <a href="#/calendar" data-tab="calendar" data-i18n="日历">日历</a>
        <a href="#/notes" data-tab="notes" data-i18n="备忘">备忘</a>
      </nav>

      <button class="icon-btn" id="btn-theme" type="button" data-act="cycle-theme" aria-label="切换主题" title="切换主题">◐</button>

      <button class="icon-btn" id="btn-settings" type="button" data-act="open-settings" aria-label="设置" title="设置" data-i18n-aria="设置" data-i18n-title="设置">⚙</button>
    </header>

    <main class="view" id="view" tabindex="-1">
      <noscript>
        <div class="page"><p class="hint">这个 App 需要 JavaScript。请在 Safari 设定里开启 JavaScript 后再打开。</p></div>
      </noscript>
    </main>

    <button class="fab" id="fab" type="button" data-act="fab" aria-label="新增">+</button>
  </div>

  <div id="modal-root"></div>
  <div id="print-root" class="print-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script>
    // 如果 app.js 或它依赖的模块没载入，至少告诉使用者哪里出问题，而不是一片空白
    (function () {
      function showFailure(message) {
        if (document.documentElement.dataset.appReady) return;
        var view = document.getElementById('view');
        if (!view) return;
        view.textContent = '';
        var section = document.createElement('section');
        section.className = 'page';
        var box = document.createElement('div');
        box.className = 'empty';
        var title = document.createElement('h2');
        title.textContent = '载入失败';
        var detail = document.createElement('p');
        detail.textContent = message;
        var hint = document.createElement('p');
        hint.className = 'hint';
        hint.textContent = '请确认所有档案都上传了（尤其是新加的模块，例如 richtext.js），并用 Safari 清除网站资料后重新开启。设置里的「部署检查」也能帮忙确认。';
        var retry = document.createElement('button');
        retry.className = 'btn';
        retry.type = 'button';
        retry.textContent = '重新载入';
        retry.addEventListener('click', function () { location.reload(); });
        box.appendChild(title);
        box.appendChild(detail);
        box.appendChild(hint);
        box.appendChild(retry);
        section.appendChild(box);
        view.appendChild(section);
      }

      window.addEventListener('error', function (event) {
        if (event && event.message) showFailure('有一个档案没有正确载入：' + event.message);
      }, true);

      document.addEventListener('DOMContentLoaded', function () {
        // 离线时（已经从快取启动）就不做网路检查，避免误报
        if (navigator.onLine) {
          var cores = ['app.js', 'db.js', 'util.js', 'ics.js', 'md.js', 'richtext.js', 'i18n.js', 'styles.css'];
          Promise.all(cores.map(function (name) {
            return fetch('./' + name + '?preflight=' + Date.now(), { cache: 'no-store' })
              .then(function (res) { return { name: name, ok: res.ok }; })
              .catch(function () { return { name: name, ok: false }; });
          })).then(function (results) {
            var missing = results.filter(function (row) { return !row.ok; }).map(function (row) { return row.name; });
            if (missing.length) showFailure('找不到这些档案：' + missing.join('、') + '。');
          });
        }

        setTimeout(function () {
          if (!document.documentElement.dataset.appReady) {
            showFailure('App 没有正常启动（可能是版本不完整，或快取还是旧的）。');
          }
        }, 6000);
      });
    })();
  </script>
</body>
</html>
